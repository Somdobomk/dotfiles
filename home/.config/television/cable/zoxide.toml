[metadata]
name = "zoxide"
description = "Browse zoxide directory history"
requirements = ["zoxide"]

[source]
command = "zoxide query -l"
no_sort = true
frecency = false

[preview]
command = "ls -la --color=always '{}'"

# tv has no normal mode, since j/k type into the search, so the vim keys
# use Ctrl: Ctrl+J/K move, Ctrl+F/B scroll the preview
[keybindings]
ctrl-j = "select_next_entry"
ctrl-k = "select_prev_entry"
ctrl-f = "scroll_preview_half_page_down"
ctrl-b = "scroll_preview_half_page_up"
shift-enter = "actions:cd"
ctrl-d = "actions:remove"

[actions.cd]
description = "Change to the selected directory"
command = "cd {} && $SHELL"
mode = "execute"

[actions.remove]
description = "Remove the selected directory from zoxide"
command = "zoxide remove {}"
mode = "fork"
