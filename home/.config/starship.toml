# Starship prompt: directory, git branch, git status, slow-command time, ❯
# Icons are Nerd Fonts 3 code points, written as \u escapes so they survive
# copy/paste and editors without the font.

add_newline = false
command_timeout = 1000
palette = "everforest"

format = """
$directory\
$git_branch\
$git_status\
$cmd_duration\
$character"""

# Everforest Dark, matching WezTerm, Neovim, and Zed
[palettes.everforest]
fg = "#d3c6aa"
grey = "#859289"
red = "#e67e80"
orange = "#e69875"
yellow = "#dbbc7f"
green = "#a7c080"
aqua = "#83c092"
blue = "#7fbbb3"
purple = "#d699b6"

[directory]
format = "[ $path ]($style)[$read_only]($read_only_style)"
style = "bold aqua"
home_symbol = " ~"
read_only = " "
read_only_style = "red"

# Replace folder names in the path with icons. Order matters: a longer name
# like "Important Documents" must come before "Documents".
[directory.substitutions]
"Documents" = " "
"Downloads" = " "
"Music" = " "
"Pictures" = " "

[git_branch]
symbol = ""
format = "[ $symbol $branch ]($style)"
style = "bold purple"

# Only shown when there's something to report
[git_status]
format = "([$all_status$ahead_behind ]($style))"
style = "red"
conflicted = " ${count} "
untracked = " ${count} "
modified = " ${count} "
staged = "[+${count} ](green)"
renamed = " ${count} "
deleted = " ${count} "
stashed = " "
ahead = "[⇡${count}](blue)"
behind = "[⇣${count}](blue)"
diverged = "[⇕⇡${ahead_count}⇣${behind_count}](yellow)"

# Shown only after commands that take 2 seconds or more
[cmd_duration]
min_time = 2000
format = "[took $duration ]($style)"
style = "yellow"

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
