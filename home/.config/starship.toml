# Starship prompt: directory, git branch, git status, slow-command time, ❯
# Icons are Nerd Fonts 3 code points, written as \u escapes so they survive
# copy/paste and editors without the font.

add_newline = false
command_timeout = 1000
palette = "gruvbox"

format = """
$directory\
$git_branch\
$git_status\
$cmd_duration\
$character"""

# Gruvbox Dark, matching Obsidian, WezTerm, Neovim, and Zed
[palettes.gruvbox]
fg = "#ebdbb2"
grey = "#928374"
red = "#fb4934"
orange = "#fe8019"
yellow = "#fabd2f"
green = "#b8bb26"
aqua = "#8ec07c"
blue = "#83a598"
purple = "#d3869b"

[directory]
format = "[ $path ]($style)[$read_only]($read_only_style)"
style = "bold aqua"
home_symbol = " ~"
read_only = " "
read_only_style = "red"

# Replace folder names in the path with icons. Order matters: a longer name
# like "Important Documents" must come before "Documents".
[directory.substitutions]
"Documents" = " "
"Downloads" = " "
"Music" = " "
"Pictures" = " "

[git_branch]
symbol = ""
format = "[ $symbol $branch ]($style)"
style = "bold purple"

# Only shown when there's something to report
[git_status]
format = "([$all_status$ahead_behind ]($style))"
style = "red"
conflicted = " ${count} "
untracked = " ${count} "
modified = " ${count} "
staged = "[+${count} ](green)"
renamed = " ${count} "
deleted = " ${count} "
stashed = " "
ahead = "[⇡${count}](blue)"
behind = "[⇣${count}](blue)"
diverged = "[⇕⇡${ahead_count}⇣${behind_count}](yellow)"

# Shown only after commands that take 2 seconds or more
[cmd_duration]
min_time = 2000
format = "[took $duration ]($style)"
style = "yellow"

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
